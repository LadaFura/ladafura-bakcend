services:
  - type: web
    name: ladafura-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        value: mysql-ladafura-ladafura-projet.k.aivencloud.com
      - key: DB_PORT
        value: "20171"
      - key: DB_NAME
        value: defaultdb
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
