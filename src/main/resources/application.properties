spring.application.name=ladafura
server.port=${PORT:8080}

# ==========================================
# Configuration Base de données Aiven Cloud (MySQL)
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql-ladafura-ladafura-projet.k.aivencloud.com}:${DB_PORT:20171}/${DB_NAME:defaultdb}?sslMode=REQUIRED&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}

# Configuration JPA / Hibernate
# Le schéma est géré par Flyway (src/main/resources/db/migration).
# Hibernate ne modifie plus la base : none par défaut ; validate une fois la base distante alignée.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# Configuration Firebase Admin SDK
# ==========================================
firebase.config.path=${FIREBASE_CONFIG_PATH:classpath:firebase-service-account.json}

# ==========================================
# Configuration Swagger / OpenAPI UI
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true

# ==========================================
# Configuration Upload & Stockage Médias (Hybride MySQL + Disque / Cloudinary optionnel)
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
file.upload.dir=uploads
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.jackson.deserialization.fail-on-null-for-primitives=false

# ==========================================
# Configuration Rate Limiting (Limitation de débit API)
# Désactivée par défaut pour éviter les blocages sur les appareils mobiles / clients externes
# ==========================================
rate-limit.enabled=${RATE_LIMIT_ENABLED:false}
rate-limit.max-requests=${RATE_LIMIT_MAX_REQUESTS:5}
rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:300}
rate-limit.scope=${RATE_LIMIT_SCOPE:ENDPOINT}

# ==========================================
# Migrations Flyway (versions V1 à V5 maximum pendant le développement)
# DÉSACTIVÉ par défaut : activer avec FLYWAY_ENABLED=true après sauvegarde de la base.
# Base existante (non vide) : V1 est marqué comme baseline, seules V2+ sont exécutées.
# ==========================================
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema existant avant Flyway

# ==========================================
# Tâches planifiées SaaS (échéances des abonnements)
# DÉSACTIVÉES par défaut : à n'activer qu'une fois V4 et V5 appliquées sur la base.
# ==========================================
ladafura.saas.taches-planifiees.enabled=${SAAS_TACHES_ENABLED:false}

# ==========================================
# Emails de notification (SMTP)
# Sans MAIL_HOST ni MAIL_FROM, l'envoi est désactivé et l'application fonctionne normalement.
# ==========================================
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Un serveur de mail indisponible ne doit pas rendre l'application « DOWN ».
management.health.mail.enabled=false
ladafura.email.expediteur=${MAIL_FROM:}
ladafura.email.contact=${LADAFURA_EMAIL_CONTACT:}
