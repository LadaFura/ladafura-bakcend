spring.application.name=ladafura
server.port=${PORT:8080}

# ==========================================
# Configuration Base de données Aiven Cloud (MySQL)
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql-ladafura-ladafura-projet.k.aivencloud.com}:${DB_PORT:20171}/${DB_NAME:defaultdb}?sslMode=REQUIRED&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}

# Configuration JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# Configuration Firebase Admin SDK
# ==========================================
firebase.config.path=${FIREBASE_CONFIG_PATH:classpath:firebase-service-account.json}

# ==========================================
# Configuration Swagger / OpenAPI UI
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true

# ==========================================
# Configuration Upload & Stockage Médias (Hybride MySQL + Disque / Cloudinary optionnel)
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
file.upload.dir=uploads
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.jackson.deserialization.fail-on-null-for-primitives=false