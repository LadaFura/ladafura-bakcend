spring.application.name=ladafura

# ==========================================
# Configuration Base de données MySQL
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/ladafura?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=ladafura-user
spring.datasource.password=admin

# Configuration JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# Configuration Firebase Admin SDK
# ==========================================
firebase.config.path=${FIREBASE_CONFIG_PATH:classpath:firebase-service-account.json}